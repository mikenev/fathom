<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fathom</title>
<meta name="description" content="Fathom: a calm fullscreen browser aquarium.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view" aria-label="Fathom aquarium"></canvas>
<div id="fade" class="fade on" aria-hidden="true"></div>
<div id="hint" class="hint" role="status"></div>
<nav id="toolbar" class="toolbar" aria-label="Controls">
  <button type="button" data-act="settings">Settings</button>
  <button type="button" data-act="fullscreen">Fullscreen</button>
  <button type="button" data-act="scene">Next scene</button>
  <button type="button" data-act="sound" aria-pressed="true">Sound on</button>
</nav>
<section id="settings" class="settings" hidden aria-label="Settings">
  <header>
    <div>
      <h1>Fathom</h1>
      <p class="sub">Settings</p>
    </div>
    <button id="close-settings" class="close" type="button" aria-label="Close settings">&times;</button>
  </header>
  <label class="row">
    <span>Scene</span>
    <select id="scene-select"></select>
  </label>
  <label class="row">
    <span>Sound</span>
    <input id="sound-toggle" type="checkbox" aria-label="Sound">
  </label>
  <h2>Species</h2>
  <div id="species-list"></div>
  <div class="actions">
    <button id="reset-defaults" type="button">Reset this scene's preset</button>
  </div>
  <footer><kbd>S</kbd>, <kbd>Esc</kbd> or Back closes &middot; <kbd>F</kbd> fullscreen &middot; <kbd>M</kbd> sound</footer>
</section>
<noscript><p class="noscript">Fathom needs JavaScript and WebGL.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
